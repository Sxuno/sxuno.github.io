			<section id = 'description'>
				<h2>Description</h2>
                <div>
                    AActor Component Instancing system for pcg based lods and eventdriven swaper for gpu driven renderning with HLSL Custom Nodes
                </div>
				<label>
                    This is a system-level framing, not marketing. You're defining the orbital model, its constraints, 
                    and what technical problems it exists to solve. This is where you explain why this is an 
                    orbital system at all and not just a procedural toy. That's solid and exactly where this belongs.
                </label>
			</section>
            <section id = 'features'>
                <h2>Features</h2>
                <label>
                    You're using “features” as user-facing vision, not implementation. That's an important distinction. 
                    This section is about interaction intent: what the designer or artist experiences, 
                    how control is exposed, where authorship lives. That's legitimate, and it prevents 
                    the system from reading like a purely academic construct.
                </label>
            </section>
            <section id = 'preformance'>
                <h2>Preformance</h2>
                <label>
                    This is where your paper earns credibility. You're not just showing numbers; 
                    you're defending choices: PCG, HLSL, data flow, update frequency, 
                    why things live on GPU vs CPU, why some decisions are locked early. This is a causal section: 
                    “because X, therefore Y.” That's exactly right.
                    Also important: this section retroactively validates the Description. 
                    If someone disagrees with your model, this is where they see the cost/benefit math.
                </label>
            </section>
            <section id = 'specifications'>
                <h2>Specifications</h2>
                <label>
                    And here's the part many papers get wrong — you're doing it right.
                    You're not listing abstract limits. You're defining authorial constraints:
                    Orbits aren't random noise Star systems are artistically curated 
                    Planet creation is deferred to Blueprints Levels own composition, not the generator
                    That makes the system reproducible and intentionally non-procedural in certain dimensions.
                    That's not a weakness — it's a design stance.
                </label>
            </section>
            <section id = 'conclusion'>
                <h2>&nbsp;</h2>

                    full procedural generation is possible, but not always desirable<br />

		<script>
			const demo = (function(){
				// dependency check
				if (!window.layout) {
					console.error('missing script dependency : framework layout')
					return
				}
				console.info('init demo')
				// privates
				let _style
				let _layout
				// modules
				const layout = (function() {
					// let _layout
					// let _style
					var controller = new Array
					// execution control module
					const init = (function() {
						_style = new CSSStyleSheet()
						_style.insertRule(`#demo {}`)
						_layout = _style.cssRules[0].style
						document.adoptedStyleSheets = [...document.adoptedStyleSheets, _style]
					})()				
					// EXPORT
					return {controller}
				})()
				const inference = (function() {
					let _viewbox // canvas contetxt?
					let _model
					// mdoules
					const viewbox = (function() {
						let _layout
						// modules
						const renderer = (function() {
							// methods
							const draw = () => {
								// runtime = modelexecution :: cpu webworker canvas2d || gpu webgpu
								// video mapping = source.requestVideoFrameCallback()
								// note: 	may just use method draw, render instead of module renderer ?
								// 			if navigator.gpu && engine = dispatch render?
								// question is about doing an sample renderer vs only implement into engine
							}
							// execution control module
							const init = (function() {
								// loadhandler
								async function loadhandler(context) {
									console.log('loadhandler renderer', context)
								}
								return loadhandler
							})
							return {draw}
						})()
						const event = (function() {
							let _observer
							let _dispatcher
							// event onhover & mouse down : viewbox => canvas context move
							// event onhover & mouse wheel : viewbox => canvas context resize
							// if context == scene :: event onhover & double click : viewbox => enable engine.input.controller
							// if engine.input.controller enabled :: key down (esc) => disable engine.input.controller # engine override?
							const init = (function() {})()
						})()
						// methods
						const rescale = () => {_layout.height = `${(window.layout.width() > 720) ? 900 * (9/16) : window.layout.width() * (9/16)}px`}
						// execution control module
						const init = (function (context) {
							if (!_layout) {
								_style.insertRule(`.viewbox {}`)
								_layout = _style.cssRules[0].style
								rescale()
								// setup html elements
							}
							async function loadhandler(context) {
								console.log('loadhandler viewbox')
							}
							return loadhandler
						})()
						// EXPORT
						return {init, rescale}
					})()
					const model = (function() {
						let _version
						let _runtime
						// modules
						const runtime = (function() {
							// methods
							const select = () => {}
							// execution control module
							const init = (function() {
								if (navigator.gpu) {
									let option
									option = document.createElement('option')
									option.textContent = 'WebGPU'
									option.selected = true
									document.querySelector('.model .runtime select').prepend(option)
								}
							})()
							return {init, select}
						})()
						const version = (function() {/*fetch from server endpoint::emulate with json?*/
							// methods
							const select = () => {}
							// execution control module
							const init = () => {
								// loadhandler
								async function loadhandler(context) {
									console.log('loadhandler version', context)
								}
								return loadhandler
							}
							return {init, select}
						})()
						// methods
						// execution control module
						const init = (function() {
							// loadhandler
							async function loadhandler(context) {
								console.log('loadhandler model', context)
							}
							return loadhandler
						})()
						// EXPORT
						return {init, runtime, version}
					})()
					const input = (function () {
						let _type
						let _source
						// modules
						const type = (function() {
							let _descriptor // type validation list :: to be replaced by conditional export?
							// modules
							const file = (function() {
								// NOTE : 		CONDITIONAL export failes _descriptor declared after
								// SOLUTION : 	add file format validation || enforce execution control model
								const png = {}
								const jpg = {}
								const gltf = {}
								// execution control module
								const init = () => {
									// loadhandler
									async function loadhandler(context) {
										console.log('loadhandler file', context)
									}
									return loadhandler
								}
								// EXPORT
								let file = {
									init,
									format : new Object
								}
								// CONDITIONAL
								if (_descriptor?.file) {
									file.format.png = png,
									file.format.jpg = jpg
								}
								if (_descriptor?.engine) {
									file.format.gltf = gltf
								}
								// RETURN VAR
								return file
							})()
							const camera = (function() {
								// execution control module
								const init = () => {
									// loadhandler
									async function loadhandler(context) {
										console.log('loadhandler camera', context)
									}
									return loadhandler
								}
								return {init}
							})()
							const display = (function() {
								// execution control module
								const init = () => {
									// device feature test sample functions

									/* copyExternalImageToTexture
									navigator.gpu?.requestAdapter().then(a => a?.requestDevice()).then(d => {
										console.log("copyExternalImageToTexture supported:", typeof d?.queue?.copyExternalImageToTexture === "function");
									}); */
									/* importExternalTexture
									navigator.gpu?.requestAdapter().then(a => a?.requestDevice()).then(d => {
									console.log("importExternalTexture supported:", typeof d?.importExternalTexture === "function");
									}); */

									// loadhandler
									async function loadhandler(context) {
										console.log('loadhandler display', context)
									}
									return loadhandler
								}
								return {init}
							})()
							const engine = (function() {
								// execution control module
								const init = (function(context) {
									// loadhandler
									async function loadhandler(context) {
										console.log('loadhandler engine', context)
									}
									return loadhandler
								})
								// EXPORT
								return {init}
							})()
							// methods
							const select = async (context) => {
								if (context.target.value === 'camera') {
									let _devices = await navigator.mediaDevices.enumerateDevices()
									// navigator.mediaDevices.ondevicechange
									console.log(_devices)
								}
								for(let s = 0; s < _source.children.length; s++) {
									_source.children[s].layout.display = 'none'
									if (_source.children[s].classList[0] === _type.value) {
										_source.children[s].layout.display = 'flex'
									}
								}
							}
							// execution control module
							const init = (function() {
								// type support verification concept // allow source format stream if navigator.gpu
								_descriptor = new Object
								_descriptor.file = Boolean(window.File && window.FileReader && window.Blob)
								_descriptor.camera = Boolean(navigator.gpu && navigator.mediaDevices?.getUserMedia)
								_descriptor.display = Boolean(navigator.gpu && navigator.mediaDevices?.getDisplayMedia)
								_descriptor.engine = Boolean(navigator.gpu && engine)
								for(let [key, value] of Object.entries(_descriptor)) {
									if (value) {
										let option
										option = document.createElement('option')
										option.textContent = key
										if (key === 'file') {option.selected = true}
										document.querySelector('.input .type select').appendChild(option)
									}
								}
								async function loadhandler(context) {
									console.log('loadhandler type', context)
								}
								return loadhandler
							})()
							// EXPORT
							return {init, file, camera, display, engine, select}
						})()
						const source = (function() {
							// methods
							const select = async (context) => {
								if(context.target.dataset.handler === 'display') {		
									let _display = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false})
									_display.getVideoTracks()[0].addEventListener('ended', () => {
										console.log('screen shareing stopped')
									})
								}
							}
							// execution control module
							const init = (function() {
								async function loadhandler(context) {
									console.log('loadhandler source', context)
								}
								return loadhandler
							})()
							// EXPORT
							return {select}
						})()
						// execution control module
						const init = (function () {
							_type = document.querySelector('.input .type select')
							_type.onchange = (event) => {type.select(event)}
							_source = document.querySelector('.input .source')
							// typeselector concept #query selector for eventlistener elements?
							for(let s = 0; s < _source.children.length; s++) {
								_style.insertRule(`.source .${_source.children[s].classList[0]} {display: none;}`)
								_source.children[s].layout = _style.cssRules[0].style
								if (_source.children[s].classList[0] === _type.value) {
									_source.children[s].layout.display = 'flex'
								}
							}
							// concept
							function enginedata() {
								for(let i = 0; i < engine.scene.info.length; i++) {
									let scene = document.createElement('option')
									scene.textContent = engine.scene.info[i].name					
									_source.querySelector('.engine').children[1].children[1].appendChild(scene)
								}
							}
							if (!engine.scene?.info) {engine.eventdispatcher.addEventListener('SceneInfo', () => {enginedata()})} else {enginedata()}
							// inputhanlder 
							// [input].[file][display][camera][engine]
							let _inputhandler = _source.querySelectorAll('.source :is(select, button)')
							for(let i = 0; i < _inputhandler.length; i++){
								if (_inputhandler[i].tagName === 'SELECT') {
									_inputhandler[i].onchange = (event) => source.select(event)
								}
								if(_inputhandler[i].tagName === 'BUTTON') {
									if(_inputhandler[i].dataset.handler === 'input') {
										_inputhandler[i].onclick = () => {
											let _input = _inputhandler[i].parentElement.querySelector('input')
											_input.onchange = (event) => source.select(event)
											_input.click()										
										}
									}
									if(_inputhandler[i].dataset.handler === 'display') {
										_inputhandler[i].onclick = (event) => source.select(event)
									}
								}
							}
							// loadhandler
							async function loadhandler(context) {
								console.log('loadhandler input', context)
							}
							return loadhandler
						})()
						// EXPORT
						return {init, type}
					})()
					const synthesize = (function() {
							// methods
							const blur = () => {}
							const downscale = () => {}
							// execution control module
							const init = (function() {
								// loadhandler
								async function loadhandler(context) {
									console.log('loadhandler synthesize', context)
								}
								return loadhandler
							})
							return {blur, downscale}
						})()
					// methods
					// execution controll method
					const init = (function() {
						console.info('init inference')
						// loadhandler
						async function loadhandler(context) {
							console.log('loadhandler inference', context)
						}
						document.querySelector('.exec button').onclick = (event) => loadhandler(event)
						return loadhandler
					})()
					// EXPORT
					return {init, viewbox, input}
				})()
				// methods
				const rescale = () => {_layout.width = `${(window.layout.width() > 720) ? 900 : window.layout.width()}px`}
				// execution controll method
				const init = (function() {
					// initialize layout
					rescale()
					// register eventlistener
					window.layout.observer.addEventListener('@media-480', () => {
						/* for (let i = 0; i < layout.controller.length; i++) {
							layout.controller[i].rescale()
						}*/
						rescale()
						inference.viewbox.rescale()
					})
					window.layout.observer.addEventListener('@media-720', () => {
						rescale()
						inference.viewbox.rescale()
					})
					window.layout.observer.addEventListener('@media-1080', () => {
						rescale()
						inference.viewbox.rescale()
					})
					window.layout.observer.addEventListener('@media-1440', () => {
						rescale()
						inference.viewbox.rescale()
					})
				})()
				// EXPORT
				return {inference}
			})()
		</script>

			</nav>

				<label>webgpu</label>

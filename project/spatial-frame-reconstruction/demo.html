		<script>
			const demo = (function(){
				// dependency check
				if (!layout) {
					console.error('missing script dependency : framework layout')
					return
				}
				console.info('init demo')
				// setup layout
				let _style
				let _layout

				_style = new CSSStyleSheet()
				_style.insertRule(`#demo {}`)
				_layout = _style.cssRules[0].style
				document.adoptedStyleSheets = [...document.adoptedStyleSheets, _style]

				function rescale() {_layout.width = `${(layout.width() > 720) ? 900 : layout.width()}px`}
				// register demo functionality as module
				const inference = (function(){
					let _context // input reference
					// module viewbox
					const viewbox = (function(){
						let _layout
						let _context // input buffer

						const rescale = () => {_layout.height = `${(layout.width() > 720) ? 900 * (9/16) : layout.width() * (9/16)}px`}
						// module controller
						const controller = {}

						const init = (function (context) {
							if (!_layout) {
								_style.insertRule(`.viewbox {}`)
								_layout = _style.cssRules[0].style
								rescale()
								// setup controller
							}
							if (context) {
								console.info('viewbox : init context')
							}
						})()
						// EXPORT
						return {rescale, init}
					})()
					// module input
					const input = (function () {
						let _features
						const init = () => {}
						const features = {}
						// EXPORT
						return {init}
					})()
					// setup methods
					const exec = (model, runtime) => {
						switch(model) {
							case 'sfr' : break
							default : console.error(`model ${model} does not exist.`)
						}
					}
					// EXPORT
					return {viewbox, exec}
				})()
				// init demo
				const init = (function(){
					rescale()
					// register eventlistener
					layout.observer.addEventListener('@media-480', () => {
						rescale()
						inference.viewbox.rescale()
					})
					layout.observer.addEventListener('@media-720', () => {
						rescale()
						inference.viewbox.rescale()
					})
					layout.observer.addEventListener('@media-1080', () => {
						rescale()
						inference.viewbox.rescale()
					})
					layout.observer.addEventListener('@media-1440', () => {
						rescale()
						inference.viewbox.rescale()
					})
				})()
				// EXPORT
				return {inference}
			})()
		</script>

		<script>
			let noscript = false
			if (!noscript) {
				(()=>{
					// TODO: refactor namespace also may already split up into layout and loadhandler? consider framework.js namespace rework

					// input layout
					let section = document.createElement('section')
					let div = document.createElement('div')
					let label = document.createElement('label')
					let input = document.createElement('input')
					document.querySelector('#demo').appendChild(section)
					section.appendChild(input)
					section.appendChild(div)
					section.appendChild(label)
					section.classList = 'input flex column'
					div.classList = 'flex'
					div.textContent = 'upload image *'
					label.textContent = '*files are only used local and are not uploaded at all!'
					// input setup
					input.type = 'file'
					input.accept = 'image/png'
					input.style.display = 'none'
					// input eventhandler
					div.addEventListener('click', () => {
						input.click()
						let media = document.querySelectorAll('div.alphagrid > div')
						// clear background images -> hide lables prepare to move into canvas
						// setup canvas original reconstruction discard old? or setup from start?

						// media[0].style.backgroundImage = 'url(./demo/color.png)'
						// media[1].style.backgroundImage = 'url(./demo/grey.png)'
					})
					// input target // move to .onchange?
					let wrapper = document.querySelector('.comparison')
					let canvas = document.createElement('canvas')
					canvas.style.width = '1080px'
					canvas.width = 1080
					canvas.style.height = '600px'
					canvas.height = 600
					ctx = canvas.getContext('2d')
					// input loadhanlder
					input.onchange = async() => {
						console.log(input.files)
						let raw = input.files[0]
						let bits = await raw.arrayBuffer()
						let bytes = new Uint8Array(bits)
						// add magic byte detection to protect against wrong fileformats? input uses os based detection only.
						// use for function selection via key?
						let blob = new Blob([bytes], {type: 'image/png'})
						let url = URL.createObjectURL(blob)
						let png = new Image()

						png.onload = () => {
							canvas.width = wrapper.clientWidth
							canvas.height = wrapper.clientHeight

							ctx.clearRect(0,0, canvas.width / 2, canvas.height / 2, 0, 0 )

							let scale = Math.min(canvas.width / png.naturalWidth, canvas.height / png.naturalHeight)
							let renderWidth = png.naturalWidth * scale
							let renderHeight = png.naturalHeight * scale
							let offsetX = (canvas.width - renderWidth) / 2
							let offsetY = (canvas.height - renderHeight) / 2

							ctx.drawImage(png, offsetX, offsetY, renderWidth, renderHeight)
							URL.revokeObjectURL(url)

							let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height)
							let pixelData = imgData.data
							// let pixelCopy = new Uint8ClampedArray(pixelData) placheholder for greyscale 'while reconstruction'

							for (let i = 0; i < pixelData.length; i +=4) {
								let r = pixelData[i]
								let g = pixelData[i + 1]
								let b = pixelData[i + 2]
								let a = pixelData[i + 3]

								pixelData[i]	 = r
								pixelData[i + 1] = g
								pixelData[i + 2] = b
								pixelData[i + 3] = a
							}
							ctx.putImageData(imgData, 0, 0)
						}
						wrapper.children[0].children[0].appendChild(canvas) // TODO : adjust scaffolding for output
						png.src = url
					}
				})()
			}

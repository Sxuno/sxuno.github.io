		<script> // NOTES
			/* notes bit logic :
				BASE 2

				Value:     64  32  16   8   4   2   1
				Bits:       0   0   0   0   1   0   1

				• 0000001 = 1
				• 0000010 = 2
				• 0000011 = 2 + 1 = 3
				• 0000101 = 4 + 1 = 5
			*/
			/* SAMPLE AI GENERATED

			// Extracts `bitCount` bits from `byte` starting at `bitPos` (0 = rightmost, 7 = leftmost).
			// Constraint: bitPos + bitCount <= 8
			function readBits(byte, bitPos, bitCount) {
			const mask = (1 << bitCount) - 1;
			return (byte >>> bitPos) & mask;
			}

			// Example: decoding a 2-byte Varint (e.g., [0xAC, 0x02] -> 300)
			let pos = 0
			let bytes = 0
			const b0 = bytes[pos++];
			const low7 = readBits(b0, 0, 7);          // First 7 bits (least significant)
			const hasByte2 = readBits(b0, 7, 1) === 1;

			let value = low7;

			if (hasByte2) {
			const b1 = bytes[pos++];
			const high7 = readBits(b1, 0, 7);       // Next 7 bits (more significant)
			const hasByte3 = readBits(b1, 7, 1) === 1; // Check if a 3rd byte follows...

			value = (high7 << 7) | low7;            // Shift high7 above low7 and merge
			}
			*/
			/* wires
				ID	type
				0	VARINT
				1	FIXED64
				2	LEN_DELIMITED
				3	START_GROUP
				4	END_GROUP
				5	FIXED32
			*/
			/* proto paths

				Navigation Path to the Nodes

				ID	Name				Wire Type			What to do in Prototype
				1	ir_version			0 (Varint)			Read number (e.g., 8)
				2	producer_name		2 (String)			Decode UTF-8 string (e.g., "pytorch")
				3	producer_version	2 (String)			Decode UTF-8 string
				7	graph				2 (Sub-message)		Step into GraphProto!
				8	opset_import		2 (Sub-message)		(Optional) Field 1 = domain (str), Field 2 = version (varint)

				GraphProto (Inside ModelProto Field #7)

				ID	Name					Wire Type			What to do in Prototype
				1	node (repeated)			2 (Sub-message)		Step into NodeProto (appears once per op node)
				2	name					2 (String)			Graph name
				5	initializer (repeated)	2 (Sub-message)		Step into TensorProto, read only Field #8 (name) & Field #1 (dims), skip Field #9 (raw_data)!
				11	input (repeated)		2 (Sub-message)		Graph inputs (ValueInfoProto -> Field #1 is name)
				12	output (repeated)		2 (Sub-message)		Graph outputs (ValueInfoProto -> Field #1 is name)

				NodeProto (Inside GraphProto Field #1)

				ID	Name					Wire Type			What to do in Prototype
				1	input (repeated)		2 (String)			Push to node.inputs[] (edge names coming IN)
				2	output (repeated)		2 (String)			Push to node.outputs[] (edge names going OUT)
				3	name					2 (String)			Node instance name (e.g., "/layer1/Conv")
				4	op_type					2 (String)			Operator type (e.g., "Conv", "Relu", "MatMul")
				5	attribute (repeated)	2 (Sub-message)		(Optional) AttributeProto: Field #1 is name (string), Field #20 is type (enum)
				7	domain					2 (String)			Custom domain (empty "" = standard ONNX)

			*/
		</script>
		<script> /* onnx node parser */
			const DEVELOPMENT = 1
			const onnx = (function() {
				function read(buffer) {
					// traversal // TODO :: make array 1D based?
					let tree
					let leaf = 'model'
					let length = 0
					let parentnode = document.createElement('div')
					parentnode.classList = 'node model'
					document.querySelector('view').appendChild(parentnode)
					for (let cursor = 0; cursor < buffer.length; cursor++) {
						// proto
						let stride = 1 + (buffer[cursor] >>> 0b00000111)
						let proto = (buffer[cursor] & 0b01111000) >>> 0b00000011
						let wire = buffer[cursor] & 0b00000111
						for (let offset = 1; offset < stride; offset++) {
							stride += (buffer[cursor+offset] >>> 0b00000111)
							proto = proto | ((buffer[cursor+offset] & 0b01111111) << (4 + 7 * (offset - 1)))
						}
						// payload
						let pad = null
						let size = null
						let value = null
						let start = null
						let end = null
						switch(wire) {
							case 0 : {
								value = buffer[cursor+stride] & 0b01111111
								pad = 1 + (buffer[cursor+stride] >>> 0b00000111)
								for(let offset = 1; offset < pad; offset++) {
									value += (buffer[cursor+stride+offset] & 0b01111111) * (2 ** (7 * offset))
									pad += (buffer[cursor+stride+offset] >>> 0b00000111)
								}
								start = cursor+stride
								end = cursor+stride+pad
								console.info(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								cursor += stride+pad-1
								console.log(`cursor move to ${cursor+1}`)
								break
							}
							case 1 : {
								console.info(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								cursor += stride + 8 - 1
								break
							}
							case 2 : {
								size = buffer[cursor+stride] & 0b01111111
								pad = 1 + (buffer[cursor+stride] >>> 0b00000111)
								for(let offset = 1; offset < pad; offset++) {
									size += (buffer[cursor+stride+offset] & 0b01111111) * (2 ** (7 * offset))
									pad += (buffer[cursor+stride+offset] >>> 0b00000111)
								}
								start = cursor+stride+pad
								end = cursor+stride+pad+size
								console.info(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire} pad ${pad} size ${size}`)
								if (proto === 7) {
								cursor += stride+pad-1
								console.log(`cursor move to ${cursor+1}`)
								} else {
								cursor += stride+pad+size-1
								console.log(`cursor move to ${cursor+1}`)
								}
								break
							} 
							case 3 : {
								console.warn('cursor @', cursor)
								console.error(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								return
							}
							case 4 : {
								console.warn('cursor @', cursor)
								console.error(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								return
							}
							case 5 : {
								console.info(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								cursor += stride + 4 - 1
								break
							}
							default : {
								console.warn('cursor @', cursor)
								console.error(`${buffer[cursor].toString(2).padStart(8, '0')} stride ${stride} proto ${proto} wire ${wire}`)
								return
							}
						}
						if(DEVELOPMENT) {
							// TODO : 	refactor to key accessor instead of switch 
							//			use flat array for tree traversal based on length
							// 			reduce redundency with helper
							//			may integrate schema selector for protoswitches

							switch(leaf) {
								case 'model' : {
									switch(proto) {
										case 1 : {
											if (value) { // placholder condition till graph traversal
											let leafnode = document.createElement('div')
												leafnode.classList = 'node ir_version'											
												leafnode.textContent = `ir_version  @ ${cursor+stride}\n${value}`
												document.querySelector('.model').appendChild(leafnode)
											}
											break
										}
										case 2 : {
											let leafnode = document.createElement('div')
											leafnode.classList = 'node producer_name'
											leafnode.textContent = `producer_name @ ${start}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.model').appendChild(leafnode)
											break
										}
										case 3 : {
											let leafnode = document.createElement('div')
											leafnode.classList = 'node producer_version'
											leafnode.textContent = `producer_version @ ${start}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.model').appendChild(leafnode)
											break
										}
										case 5 : {
											let leafnode = document.createElement('div')
											leafnode.classList = 'node model_version'
											leafnode.textContent = `model_version @ ${cursor+stride}\n${value} `
											document.querySelector('.model').appendChild(leafnode)
											break
										}
										case 7 : {
											leaf = 'graph'
											length = size
											let leafnode = document.createElement('div')
											leafnode.classList = 'node graph'
											document.querySelector('.model').appendChild(leafnode)
											break
										}
										case 8 : {
											break
										}
									}
									break
								}
								case 'graph' : {
									switch(proto) {
										case 1 : {
											leaf = 'node'
											length = length - (end - cursor)
											tree = length
											length = size
											let leafnode = document.createElement('div')
											leafnode.classList = 'node graph_node'
											document.querySelector('.graph').appendChild(leafnode)
											break
										}
										case 2 : {
											length = length - (end - cursor - stride) 
											if (length === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node graph_name'
											leafnode.textContent = `graph_name @ ${start} :: ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.graph').appendChild(leafnode)
											break
										}
										case 5 : {
											length = length - (end - cursor - stride) 
											if (length === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node initializer_tensorProto'
											leafnode.textContent = `initializer_tensorProto @ ${start} :: ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.graph').appendChild(leafnode)
											break
										}
										case 11 : {
											length = length - (end - cursor - stride) 
											if (length === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node input_valueInfo'
											leafnode.textContent = `input_valueInfo @ ${start}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.graph').appendChild(leafnode)
											break
										}
										case 12 : {
											length = length - (end - cursor - stride) 
											if (length === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node output_valueInfo'
											leafnode.textContent = `output_valueInfo @ ${start} :: ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											document.querySelector('.graph').appendChild(leafnode)
											break
										}
									}
									break
								}
								case 'node' : {
									switch(proto) {
										case 1 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node input'
											leafnode.textContent = `input @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
										case 2 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node output'
											leafnode.textContent = `output @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
										case 3 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node name'
											leafnode.textContent = `name @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
										case 4 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node op_type'
											leafnode.textContent = `op_type @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
										case 5 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node node_attriute'
											leafnode.textContent = `node_attribute @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
										case 7 : {
											length = length - (end - cursor - stride) 
											tree = tree - length
											if (length === 0) {leaf = 'graph'}
											if (tree === 0) {leaf = 'model'}
											let leafnode = document.createElement('div')
											leafnode.classList = 'node domain'
											leafnode.textContent = `domain @ ${start} :: ${tree} - ${length}\n${new TextDecoder().decode(buffer.subarray(start, end))}`
											let html = document.querySelectorAll('.graph_node')
											html[html.length-1].appendChild(leafnode)
											break
										}
									}
									break
								}
								case 'tensor' : {
									switch(proto) {
										case 0 : {
											break
										}
									}
									break
								}
							}
						}
					}
				}
				return {read}
			})()
		</script>
		<script> // secure context			
			if (window.location.protocol !== 'file:') {		
				(async function() {
					STREAM = 0

					let respone 
					let bits  
					let bytes

					if(!STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						buffer = await response.arrayBuffer()
						bytes = new Uint8Array(buffer)
					}
					if (STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						// START WORKER && RINGBUFFERPOOL
						buffer = response.body.getReader()
						while (true) {
							let {value, done} = await buffer.read()
							if (done) break
							// CHUNK LOGIC VALIDATION AND PARSING
							bytes = new Uint8Array(value)
						}
					}
					onnx.read(bytes)
				})()
			}
		</script>
		<script> // file context 
			if (window.location.protocol === 'file:') {
				let body 
				let input 
				let view
				body = document.querySelector('#preview div')
				input = document.createElement('input')
				view = document.createElement('view')
				input.accept = '.onnx'
				input.type = 'file'
				input.style.paddingBottom = '10px'
				body.innerHTML = ''
				body.appendChild(input)

				input.onchange = async() => {
					let buffer = await input.files[0].arrayBuffer()
					let bytes = new Uint8Array(buffer)
					try { body.removeChild(view)} catch {body.appendChild(view)}
					// view.textContent = new TextDecoder().decode(bytes)
					onnx.read(bytes)
				}
			}
		</script>

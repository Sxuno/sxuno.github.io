		<!-- PROTOTYPE OUTPUT -->
		 <script>
			if (window.location.protocol !== 'file:') {		
				(async function() {
					STREAM = 0

					let respone 
					let bits  
					let bytes

					if(!STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						bits = await response.arrayBuffer()
						bytes = new Uint8Array(bits)
					}
					if (STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						// START WORKER && RINGBUFFERPOOL
						bits = response.body.getReader()
						while (true) {
							let {value, done} = await bits.read()
							if (done) break
							// CHUNK LOGIC VALIDATION AND PARSING
							bytes = new Uint8Array(value)
							console.log(bytes)
						}
					}
					let buffer = bytes
					document.querySelector('#preview div').textContent = String(buffer)
				})()
			}
		 </script>

		<!-- FILE CONTEXT FALLBACK -->
		<script>
			if (window.location.protocol === 'file:') {
				let body 
				let input 
				let view
				body = document.querySelector('#preview div')
				input = document.createElement('input')
				view = document.createElement('view')
				input.accept = '.onnx'
				input.type = 'file'
				input.style.paddingBottom = '10px'
				body.innerHTML = ''
				body.appendChild(input)

				input.onchange = async() => {
					console.log(input)
					let onnx = input.files[0]
					let bits = await onnx.arrayBuffer()
					let bytes = new Uint8Array(bits)
					try { body.removeChild(view)} catch {body.appendChild(view)}
					view.textContent = bytes
				}
			}
		</script>

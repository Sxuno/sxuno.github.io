		<script> /* NOTES
			notes bit logic :
			BASE 2

			Value:     64  32  16   8   4   2   1
			Bits:       0   0   0   0   1   0   1

			• 0000001 = 1
			• 0000010 = 2
			• 0000011 = 2 + 1 = 3
			• 0000101 = 4 + 1 = 5
			
			wires
				ID	type
				0	VARINT
				1	FIXED64
				2	LEN_DELIMITED
				3	START_GROUP
				4	END_GROUP
				5	FIXED32
			
			Protos:

				https://onnx.ai/onnx/api/classes.html // TODO : use official names for schematic implementation

			*/
		</script>
		<script> // onnx protobuffer // planned usage :: new onnx.protobuffer({mode: weights, tree: none})
			// FLAGS
			DEBUG = 1
			LOG = 1
			LOG_TREE = 0
			LOG_BYTE = 0
			LOG_CURSOR = 0
			LOG_LENGTH = 1

			const onnx = (function() {
				const data_type = {0: 'UNDEFINED', 1: 'FLOAT', 2: 'UINT8', 3: 'INT8', 4: 'UINT16', 5: 'INT16', 6: 'INT32', 7: 'INT64', 9: 'BOOL', 10: 'FLOAT16', 11: 'DOUBLE'}
				const att_type = {0: 'UNDEFINED', 1: 'FLOAT', 2:'INT', 3:'STRING', 4:'TENSOR', 5:'GRAPH', 6:'FLOATS', 7:'INTS', 8:'STRINGS', 9:'TENSORS', 10:'GRAPHS', 11:'SPARSE_TENSOR', 12:'SPARS_TENSORS', 13:'TYPE_PROTO', 14:'TYPE_PROTOS'}
				const data_loc = {0: 'DEFAULT', 1:'EXTERNAL'}
				function read(buffer) {
					if(LOG_LENGTH){console.info('buffer byte length', buffer.length)}
					// traversal
					let tri = [{leaf : 'model', size : buffer.length}]
					let depth = 1
					if(LOG_TREE){console.warn(`leaf module size ${tri[0].size} added`)}

					let parentnode = document.createElement('div')
					parentnode.classList = 'model'
					parentnode.textContent = `model :: size ${tri[0].size} bytes`
					document.querySelector('#preview div').appendChild(parentnode)

					for (let index = 0; index < buffer.length; index++) {
						let cursor = index
						let start = index // note : as payload identificator?
						let end = null

						let msb = buffer[index] >>> 0b00000111
						let proto = (buffer[index] & 0b01111000) >>> 0b00000011
						let wire = buffer[index] & 0b00000111
						for (let offset = 1; offset <= msb; offset++) {
							cursor++
							msb += (buffer[cursor] >>> 0b00000111)
							proto += ((buffer[cursor] & 0b01111111) * ( 2 ** (4 + 7 * (offset - 1))))
						}
						let continues = msb
						let size = null 
						let value = null
						let message = null
						let length = msb+1
						cursor++
						switch(wire) {
							case 0 : {
								// start += length
								msb = buffer[cursor] >>> 0b00000111
								value = buffer[cursor] & 0b01111111
								for(let offset = 1; offset <= msb; offset++) {
									cursor++
									msb += (buffer[cursor] >>> 0b00000111)
									value += (buffer[cursor] & 0b01111111) * (2 ** (7 * offset))
								}
								size = msb+1
								length += size
								end = index+length-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								break
							}
							case 1 : {
								msb = 0
								size = 8
								length += size
								end = cursor+size-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								break
							}
							case 2 : {
								msb = buffer[cursor] >>> 0b00000111
								value = buffer[cursor] & 0b01111111
								for(let offset = 1; offset <= msb; offset++) {
									cursor++
									msb += (buffer[cursor] >>> 0b00000111)
									value += (buffer[cursor] & 0b01111111) * (2 ** (7 * offset))
								}
								size = value
								length += msb+1+size
								end = index+length-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire} pad ${pad} size ${size}`)}
								break
							} 
							case 3 : {
								console.warn('index @', index)
								console.error(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}\nboundry exit error`)
								return
							}
							case 4 : {
								console.warn('index @', index)
								console.error(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}\nboundry exit error`)
								return
							}
							case 5 : {
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								msb = 0
								size = 4
								length += size
								end = cursor+size-1
								break
							}
							default : {
								console.error(`${index} :: ${buffer[index].toString(2).padStart(8, '0')} \nnode ${tri[depth-1].leaf}\nmsb ${msb} proto ${proto} wire ${wire} \nsize ${size} length ${length} end ${end}`)
								return
							}
						}
						switch(tri[tri.length-1].leaf) {
							case 'model' : {
								switch(proto) {
									case 1 : {

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nir_version\n${value}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 2 : {
										let leafnode = document.createElement('div')
										leafnode.classList = 'model producer_name'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nprducer_name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 3 : {
										let leafnode = document.createElement('div')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nprducer_version\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.model').appendChild(leafnode)

										document.querySelector('.model').appendChild(leafnode)

										document.querySelector('.model').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 8 : {
										tri.push({leaf : 'operatorset', size : size})

										let leafnode = document.createElement('div')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nmodel operatorset`
										document.querySelector('.model').appendChild(leafnode)
										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
								}
								break
							}
							case 'graph' : {
								switch(proto) {
									case 1 : {
										tri.push({leaf : 'node', size : size})

										let html = document.querySelectorAll('.model.graph')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph node`

										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 2 : {

										let leafnode = document.createElement('div')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph_name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.graph').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 5 : {
										tri.push({leaf : 'tensor', size : size})
										
										let leafnode = document.createElement('div')
										leafnode.classList = 'graph tensor'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph initializer_tensorProto`
										document.querySelector('.graph').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 11 : {
										tri.push({leaf: 'valueinfo', size: size})

										let leafnode = document.createElement('div')
										leafnode.classList = 'graph valueinfo input'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph input`
										document.querySelector('.graph').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 12 : {
										tri.push({leaf: 'valueinfo', size: size})

										let leafnode = document.createElement('div')
										leafnode.classList = 'graph valueinfo output'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph output`
										document.querySelector('.graph').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 13 : {
										tri.push({leaf: 'valueinfo', size: size})
										
										let leafnode = document.createElement('div')
										leafnode.classList = 'graph valueinfo'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph valueinfo`
										document.querySelector('.graph').appendChild(leafnode)
										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 16 : {
										tri.push({leaf : 'stringstringentry', size : size})

										let leafnode = document.createElement('div')
										leafnode.classList = 'graph metadata_props'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph metadata_props`
										document.querySelector('.graph').appendChild(leafnode)
										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
								}
								break
							}
							case 'node' : {
								switch(proto) {
									case 1 : {

										let leafnode = document.createElement('div')
										leafnode.classList = 'node input'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode input\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')
										html[html.length-1].appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 2 : {

										let leafnode = document.createElement('div')
										leafnode.classList = 'node output'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode output\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')
										html[html.length-1].appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 3 : {

										let leafnode = document.createElement('div')
										leafnode.classList = 'node name'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')
										html[html.length-1].appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 4 : {

										let leafnode = document.createElement('div')
										leafnode.classList = 'node op_type'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode op_type\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')
										html[html.length-1].appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 5 : {
										tri.push({leaf : 'attribute', size : size})

										let leafnode = document.createElement('div')
										leafnode.classList = 'node attribute'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode attribute`
										let html = document.querySelectorAll('.graph.node')

										leafnode.classList = 'node domain'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode domain\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')
										html[html.length-1].appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}

										if (tri[tri.length-1].leaf === 'graph') {html = document.querySelectorAll('.graph')}
										if (tri[tri.length-1].leaf === 'model') {html = document.querySelectorAll('.model')}

		<script> // server context
			if (window.location.protocol !== 'file:') {		
				(async function() {
					STREAM = 0

					let respone 
					let bits  
					let bytes

					if(!STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						buffer = await response.arrayBuffer()
						bytes = new Uint8Array(buffer)
					}
					if (STREAM) {
						response = await fetch('./download/sfr-bundle.onnx')
						// START WORKER && RINGBUFFERPOOL
						buffer = response.body.getReader()
						while (true) {
							let {value, done} = await buffer.read()
							if (done) break
							// CHUNK LOGIC VALIDATION AND PARSING
							bytes = new Uint8Array(value)
						}
					}
					onnx.read(bytes)
				})()
			}

				input.accept = '.onnx'

				input.style.paddingBottom = '10px'
				body.innerHTML = ''
				body.appendChild(input)

				input.onchange = async() => {

					let bytes = new Uint8Array(buffer)
					try { body.removeChild(view)} catch {body.appendChild(view)}

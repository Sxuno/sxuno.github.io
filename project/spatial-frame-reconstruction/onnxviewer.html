		<script> // NOTES
			/* notes bit logic :
				BASE 2

				Value:     64  32  16   8   4   2   1
				Bits:       0   0   0   0   1   0   1

				• 0000001 = 1
				• 0000010 = 2
				• 0000011 = 2 + 1 = 3
				• 0000101 = 4 + 1 = 5
			*/
			/* SAMPLE AI GENERATED

			// Extracts `bitCount` bits from `byte` starting at `bitPos` (0 = rightmost, 7 = leftmost).
			// Constraint: bitPos + bitCount <= 8
			function readBits(byte, bitPos, bitCount) {
			const mask = (1 << bitCount) - 1;
			return (byte >>> bitPos) & mask;
			}

			// Example: decoding a 2-byte Varint (e.g., [0xAC, 0x02] -> 300)
			let pos = 0
			let bytes = 0
			const b0 = bytes[pos++];
			const low7 = readBits(b0, 0, 7);          // First 7 bits (least significant)
			const hasByte2 = readBits(b0, 7, 1) === 1;

			let value = low7;

			if (hasByte2) {
			const b1 = bytes[pos++];
			const high7 = readBits(b1, 0, 7);       // Next 7 bits (more significant)
			const hasByte3 = readBits(b1, 7, 1) === 1; // Check if a 3rd byte follows...

			value = (high7 << 7) | low7;            // Shift high7 above low7 and merge
			}
			*/
			/* wires
				ID	type
				0	VARINT
				1	FIXED64
				2	LEN_DELIMITED
				3	START_GROUP
				4	END_GROUP
				5	FIXED32
			*/
			/* proto paths

				Navigation Path to the Nodes

				ID	Name				Wire Type			What to do in Prototype
				1	ir_version			0 (Varint)			Read number (e.g., 8)
				2	producer_name		2 (String)			Decode UTF-8 string (e.g., "pytorch")
				3	producer_version	2 (String)			Decode UTF-8 string
				7	graph				2 (Sub-message)		Step into GraphProto!
				8	opset_import		2 (Sub-message)		(Optional) Field 1 = domain (str), Field 2 = version (varint)

				GraphProto (Inside ModelProto Field #7)

				ID	Name					Wire Type			What to do in Prototype
				1	node (repeated)			2 (Sub-message)		Step into NodeProto (appears once per op node)
				2	name					2 (String)			Graph name
				5	initializer (repeated)	2 (Sub-message)		Step into TensorProto, read only Field #8 (name) & Field #1 (dims), skip Field #9 (raw_data)!
				11	input (repeated)		2 (Sub-message)		Graph inputs (ValueInfoProto -> Field #1 is name)
				12	output (repeated)		2 (Sub-message)		Graph outputs (ValueInfoProto -> Field #1 is name)

				NodeProto (Inside GraphProto Field #1)

				ID	Name					Wire Type			What to do in Prototype
				1	input (repeated)		2 (String)			Push to node.inputs[] (edge names coming IN)
				2	output (repeated)		2 (String)			Push to node.outputs[] (edge names going OUT)
				3	name					2 (String)			Node instance name (e.g., "/layer1/Conv")
				4	op_type					2 (String)			Operator type (e.g., "Conv", "Relu", "MatMul")
				5	attribute (repeated)	2 (Sub-message)		(Optional) AttributeProto: Field #1 is name (string), Field #20 is type (enum)
				7	domain					2 (String)			Custom domain (empty "" = standard ONNX)

			*/
		</script>
		<script> /* onnx node parser */
			// FLAGS
			DEBUG = 1
			LOG = 1
			LOG_TREE = 0
			LOG_BYTE = 0
			LOG_CURSOR = 0
			LOG_LENGTH = 1

			const onnx = (function() {
				const data_type = {1 : 'FLOAT', 2 : 'UINT8', 3 : 'INT8', 4: 'UINT16', 5: 'INT16', 6: 'INT32', 7: 'INT64', 9: 'BOOL', 10: 'FLOAT16', 11: 'DOUBLE'}

				function read(buffer) {
					if(LOG_LENGTH){console.info('buffer byte length', buffer.length)}
					// traversal
					let tri = [{leaf : 'model', size : buffer.length}]
					let depth = 1
					console.log('tri '+tri[0].size)

					let parentnode = document.createElement('div')
					parentnode.classList = 'model'
					parentnode.textContent = `model :: size ${tri[0].size} bytes`
					document.querySelector('#preview div').appendChild(parentnode)

					for (let index = 0; index < buffer.length; index++) {
						let cursor = index
						let start = index // note : as payload identificator?
						let end = null

						let msb = buffer[index] >>> 0b00000111
						let proto = (buffer[index] & 0b01111000) >>> 0b00000011
						let wire = buffer[index] & 0b00000111
						for (let offset = 1; offset <= msb; offset++) {
							cursor++
							msb += (buffer[cursor] >>> 0b00000111)
							proto += ((buffer[cursor] & 0b01111111) * ( 2 ** (4 + 7 * (offset - 1))))
						}
						let continues = msb
						let size = null 
						let value = null
						let message = null
						let length = msb+1
						cursor++
						switch(wire) {
							case 0 : {
								// start += length
								msb = buffer[cursor] >>> 0b00000111
								value = buffer[cursor] & 0b01111111
								for(let offset = 1; offset <= msb; offset++) {
									cursor++
									msb += (buffer[cursor] >>> 0b00000111)
									value += (buffer[cursor] & 0b01111111) * (2 ** (7 * offset))
								}
								size = msb+1
								length += size
								end = index+length-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								break
							}
							case 1 : {
								msb = 0
								size = 8
								length += size
								end = cursor+size-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								break
							}
							case 2 : {
								msb = buffer[cursor] >>> 0b00000111
								value = buffer[cursor] & 0b01111111
								for(let offset = 1; offset <= msb; offset++) {
									cursor++
									msb += (buffer[cursor] >>> 0b00000111)
									value += (buffer[cursor] & 0b01111111) * (2 ** (7 * offset))
								}
								size = value
								length += msb+1+size
								end = index+length-1
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire} pad ${pad} size ${size}`)}
								break
							} 
							case 3 : {
								console.warn('index @', index)
								console.error(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}\nboundry exit error`)
								return
							}
							case 4 : {
								console.warn('index @', index)
								console.error(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}\nboundry exit error`)
								return
							}
							case 5 : {
								if(LOG_BYTE){console.info(`${buffer[index].toString(2).padStart(8, '0')} proto ${tri[depth? depth-1:depth].leaf} @ ${index} msb ${msb} proto ${proto} wire ${wire}`)}
								msb = 0
								size = 4
								length += size
								end = cursor+size-1
								break
							}
							default : {
								console.error(`${index} :: ${buffer[index].toString(2).padStart(8, '0')} \nnode ${tri[depth-1].leaf}\nmsb ${msb} proto ${proto} wire ${wire} \nsize ${size} length ${length} end ${end}`)
								return
							}
						}
						switch(tri[tri.length-1].leaf) {
							case 'model' : {
								switch(proto) {
									case 1 : {
										let leafnode = document.createElement('div')
										leafnode.classList = 'model ir_version'											
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nir_version\n${value}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 2 : {
										let leafnode = document.createElement('div')
										leafnode.classList = 'model producer_name'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nprducer_name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 3 : {
										let leafnode = document.createElement('div')
										leafnode.classList = 'model producer_version'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nprducer_version\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break

									case 5 : {

										document.querySelector('.model').appendChild(leafnode)

										break

									case 7 : {

										let leafnode = document.createElement('div')

										document.querySelector('.model').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break

									case 8 : {
										let leafnode = document.createElement('div')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nprducer_version\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.model').appendChild(leafnode)
										cursor = end

										break

								}
								break
							}
							case 'graph' : {
								switch(proto) {
									case 1 : {
										tri.push({leaf : 'node', size : size})

										let html = document.querySelectorAll('.model.graph')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph node`
										html[html.length-1].appendChild(leafnode)
										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 2 : {

										let leafnode = document.createElement('div')
										leafnode.classList = 'node graph_name'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph_name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.graph').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 5 : {
										tri.push({leaf : 'tensor', size : size})
										
										let leafnode = document.createElement('div')
										leafnode.classList = 'graph tensor'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph initializer_tensorProto`
										document.querySelector('.graph').appendChild(leafnode)
										
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 11 : {
										// if(tri[tri.length-1]?.leaf !== 'input') {tri.push({leaf: 'input', size : size})}

										let leafnode = document.createElement('div')
										leafnode.classList = 'graph input'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph input\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.graph').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 12 : {
										// if(tri[tri.length-1]?.leaf !== 'output') {tri.push({leaf: 'output', size : size})}

										let leafnode = document.createElement('div')
										leafnode.classList = 'graph output'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph output\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										document.querySelector('.graph').appendChild(leafnode)
										cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break
									}
									case 13 : {
										tri.push({leaf: 'valueinfo', size: size})
										
										let leafnode = document.createElement('div')
										leafnode.classList = 'graph valueinfo'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph valueinfo`
										document.querySelector('.graph').appendChild(leafnode)
										// cursor = end
										if(LOG_CURSOR){console.info(`cursor move to ${cursor}`)}
										break

									case 16 : {

										let leafnode = document.createElement('div')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\ngraph metadata_props\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode input\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`

										leafnode.classList = 'node name'
										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode name\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`
										let html = document.querySelectorAll('.graph.node')

										leafnode.textContent = `message @ ${index} bytelength ${length} :: tag : wire ${wire} type ${tri[depth-1].leaf}_proto ${proto} :: payload @ ${cursor} - ${end} : size ${size}\nnode op_type\n${new TextDecoder().decode(buffer.subarray(cursor+1, end+1))}`

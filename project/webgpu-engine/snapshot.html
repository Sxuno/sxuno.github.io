		<script src = './../../system/framework.js'></script>
		<script src = './../../beta/engine/core.js' data-autoinit></script>

		<!-- SETUP -->
		<script>
			// PATH custom config
			engine.PATH.content = './../../content/'
			engine.PATH.shader = './../build/shadercache/'

			// engine.eventdispatcher.addEventListener('InitCore', () => {console.warn('Event InitCore callback')})
			engine.eventdispatcher.addEventListener('InitGPU', () => {
				document.querySelector('.event.GPUEnabled').style.visibility = 'visible'
			})
			// engine.init()
			// engine.init('load')
			// engine.init('DOMContentLoaded')

			/* Document ReadyState Log */
			document.onreadystatechange = () => {console.log(`${Temporal.Now.plainTimeISO()} ${document.readyState}`)}

	<body>
		<header>
			<nav>
				<label class = 'left'>
					<img src = './../../media/icon/menu.svg' />
					<a href='./../../index.html'>Home</a>
				</label>
				<label class = 'right'>
					English <img src = './../../media/icon/settings.svg' />
				</label>
			</nav>
		</header>
		<main id = 'webgpu-engine'>
			<h1><a href = './../webgpu-engine.html'>WebGPU Engine</a><label>snapshot demo</label></h1>
			<section id = 'snapshot' style = 'display: flex; flex-direction: column;'>
				<titel>Buffer mapping process</titel>
				<label>engine.gpu.resource.init() see developer console</label>

				<canvas scene = 'rgb-cubes'></canvas>
				<canvas scene = 'rgb-cubes' camera = 'default' view = 'unlit'></canvas>
				<canvas scene = 'rgb-cubes' camera = 'default' view = 'depth'></canvas>

				<canvas scene = 'rgb-cubes' renderer = 'raytracer' view = 'lit'></canvas>
				<canvas scene = 'rgb-cubes' renderer = 'raytracer' view = 'unlit'></canvas>
				<canvas scene = 'rgb-cubes' renderer = 'raytracer' view = 'depth'></canvas>

				<canvas scene = 'rgb-spheres' ></canvas>
				<canvas scene = 'rgb-spheres' camera = 'false' view = 'unlit'></canvas>
				<canvas scene = 'rgb-spheres' camera = 'default' view = 'depth'></canvas>
			</section>
		</main>
		<footer>

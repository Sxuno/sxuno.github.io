async function audioInput() {
	// DEBUG
	console.log(await navigator)
  if (!isAudioRunning) {
	// --- START AUDIO ---
	try {
	  stream = await navigator.mediaDevices.getUserMedia({ 
		audio: { echoCancellation: false, noiseSuppression: true } 
	  });
	  
	  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
	  
	  const source = audioCtx.createMediaStreamSource(stream);
	  const gainNode = audioCtx.createGain();
	  const analyser = audioCtx.createAnalyser();
	  
	  analyser.fftSize = 256;
	  const dataArray = new Uint8Array(analyser.frequencyBinCount);
	  
	  source.connect(gainNode);
	  gainNode.connect(analyser);
	  //gainNode.connect(audioCtx.destination);
	  
	  gainNode.gain.value = 2.0; 
	  
	  isAudioRunning = true;
	  //button.textContent = "Stop Audio";
	  
		// Processing loop
		const canvas = document.createElement('canvas');
		document.body.appendChild(canvas)
		const canvasCtx = canvas.getContext('2d');

		// Inside your processAudio loop:
		function processAudio() {
			if (!isAudioRunning) return;
			requestAnimationFrame(processAudio);
			
			// Define bufferLength directly from the analyser node
			const bufferLength = analyser.frequencyBinCount;

			// Clear the canvas for the new frame
			canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
			
			// CHOOSE ONE VISUALIZATION STYLE BELOW:
			
			// --- OPTION A: BAR EQUALIZER (Frequency Data) ---
			analyser.getByteFrequencyData(dataArray);
			
			const barWidth = (canvas.width / bufferLength) * 2.5;
			let x = 0;
			
			for (let i = 0; i < bufferLength; i++) {
				// Value is 0 to 255. Convert to a height percentage.
				const percent = dataArray[i] / 255;
				const barHeight = canvas.height * percent;
				
				// Color changes based on frequency index (i)
				canvasCtx.fillStyle = `rgb(${dataArray[i] + 50}, 50, 200)`;
				canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
				
				x += barWidth;
			}		
			/*
			// --- OPTION B: OSCILLOSCOPE WAVE (Time Domain Data) ---
			analyser.getByteTimeDomainData(dataArray);
			
			canvasCtx.lineWidth = 2;
			canvasCtx.strokeStyle = 'rgb(0, 255, 0)';
			canvasCtx.beginPath();
			
			const sliceWidth = canvas.width / bufferLength;
			let x = 0;
			
			for (let i = 0; i < bufferLength; i++) {
				// Normalize 0-255 data down to a -1 to 1 range, then map to canvas height
				const v = dataArray[i] / 128.0; 
				const y = (v * canvas.height) / 2;
				
				if (i === 0) {
				canvasCtx.moveTo(x, y);
				} else {
				canvasCtx.lineTo(x, y);
				}
				
				x += sliceWidth;
			}			
			canvasCtx.lineTo(canvas.width, canvas.height / 2);
			canvasCtx.stroke();
			*/
		}
	  processAudio();

	} catch (err) {
	  console.error('Error starting audio:', err);
	}

  } else {
	// --- STOP & DISCONNECT AUDIO ---
	
	// 1. Stop the physical microphone hardware (turns off the browser recording icon)
	if (stream) {
	  stream.getTracks().forEach(track => track.stop());
	  stream = null;
	}

	// 2. Close the AudioContext to release system audio resources
	if (audioCtx) {
	  await audioCtx.close();
	  audioCtx = null;
	}

	isAudioRunning = false;
	//button.textContent = "Start Audio";
	console.log("Audio completely disconnected.");
  }
}

function runtime() {
	console.log('load')
	audioInput()
}

window.addEventListener('load', event => runtime())

</script>

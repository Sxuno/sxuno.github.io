<script>
// observer test

const elements = Array.from(document.querySelectorAll('div'))

const observer = {
    init : async function() {
        return new Promise(resolve => {
            let _resize = false
            let _intersect = false
            console.log('observer')
            const resolver = () => {
                if (_intersect && _resize) {
                    resolve()
                }
            }
            window.addEventListener('resize', () => {
                observer.resize.window = true
                console.log(`resize window ${window.screenX} ${window.screenY}`)
            })
            observer.resize.element = new ResizeObserver(entries => {
                if(!observer.resize.window) {
                    for (const entry of entries) {
                        console.log(`resize ${entry.target.nodeName}`)
                    } 
                } else {
                    observer.resize.window = false
                }
                _resize = true
                resolver()
            })
            observer.intersect = new IntersectionObserver(entries => {
                for (const entry of entries) {
                    console.log(`intersect ${entry.target.nodeName}`)
                }
                _intersect = true
                resolver()
            })
            for (const element of elements) {
                observer.resize.element.observe(element)
                observer.intersect.observe(element)
            }
        })
    },
    resize : {
        window : null,
        element : null
    },
    intersect : null,
}
</script>
